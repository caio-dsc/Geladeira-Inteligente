<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F8FAF9" />
      <stop offset="60%" stop-color="#F1F5F3" />
      <stop offset="100%" stop-color="#E7EEEB" />
    </radialGradient>

    <!-- 3D Disc Rim Gradient -->
    <linearGradient id="rimGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F3F7F5" />
      <stop offset="70%" stop-color="#D6E0DC" />
      <stop offset="100%" stop-color="#BCC9C4" />
    </linearGradient>

    <!-- 3D Disc Face Gradient -->
    <radialGradient id="faceGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F6F9F8" />
      <stop offset="100%" stop-color="#E3EBE7" />
    </radialGradient>

    <!-- Bevel Inset Shadow -->
    <filter id="discShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0F2822" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F2822" flood-opacity="0.10" />
    </filter>

    <filter id="rimHighlight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>

    <filter id="innerBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2822" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Outer Tech Circuit Lines (Left Side) -->
  <g stroke="#CBD7D2" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
    <!-- Top Left branch -->
    <path d="M 420 220 L 280 220 L 220 270 L 80 270" />
    <path d="M 400 260 L 310 260 L 250 310 L 120 310" />
    <path d="M 380 340 L 260 340 L 210 380 L 90 380" />
    <path d="M 390 410 L 320 410 L 270 460 L 140 460" />
    <path d="M 410 450 L 350 450 L 300 500 L 180 500" />
    <path d="M 260 340 L 230 340 L 190 380 L 110 380" />
  </g>

  <!-- Left Circuit Terminals and Nodes -->
  <g fill="#CBD7D2" opacity="0.8">
    <circle cx="80" cy="270" r="6" />
    <circle cx="120" cy="310" r="5" />
    <circle cx="220" cy="270" r="4" />
    <circle cx="250" cy="310" r="4.5" />
    <circle cx="90" cy="380" r="5" />
    <circle cx="140" cy="460" r="5" />
    <circle cx="180" cy="500" r="5" />
    <!-- Square terminal bus (4 squares) -->
    <rect x="130" y="260" width="6" height="6" rx="1" />
    <rect x="142" y="260" width="6" height="6" rx="1" />
    <rect x="154" y="260" width="6" height="6" rx="1" />
    <rect x="166" y="260" width="6" height="6" rx="1" />

    <rect x="100" y="450" width="6" height="6" rx="1" />
    <rect x="112" y="450" width="6" height="6" rx="1" />
    <rect x="124" y="450" width="6" height="6" rx="1" />
    <rect x="136" y="450" width="6" height="6" rx="1" />
  </g>

  <!-- Outer Tech Circuit Lines (Right Side) -->
  <g stroke="#CBD7D2" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75">
    <!-- Top Right branch -->
    <path d="M 780 230 L 920 230 L 980 280 L 1110 280" />
    <path d="M 800 290 L 890 290 L 950 340 L 1080 340" />
    <path d="M 810 370 L 940 370 L 990 420 L 1120 420" />
    <path d="M 790 440 L 880 440 L 930 490 L 1050 490" />
    <path d="M 920 230 L 960 190 L 1060 190" />
  </g>

  <!-- Right Circuit Terminals and Nodes -->
  <g fill="#CBD7D2" opacity="0.8">
    <circle cx="1110" cy="280" r="6" />
    <circle cx="1080" cy="340" r="5" />
    <circle cx="980" cy="280" r="4.5" />
    <circle cx="950" cy="340" r="4" />
    <circle cx="1120" cy="420" r="5" />
    <circle cx="1050" cy="490" r="5" />
    <circle cx="1060" cy="190" r="5" />

    <!-- Square terminal bus -->
    <rect x="1010" y="270" width="6" height="6" rx="1" />
    <rect x="1022" y="270" width="6" height="6" rx="1" />
    <rect x="1034" y="270" width="6" height="6" rx="1" />
    <rect x="1046" y="270" width="6" height="6" rx="1" />

    <rect x="1020" y="410" width="6" height="6" rx="1" />
    <rect x="1032" y="410" width="6" height="6" rx="1" />
    <rect x="1044" y="410" width="6" height="6" rx="1" />
    <rect x="1056" y="410" width="6" height="6" rx="1" />
  </g>

  <!-- Concentric Outer Dotted Orbit Ring -->
  <circle cx="600" cy="337.5" r="285" stroke="#DDE6E2" stroke-width="1.5" stroke-dasharray="3 6" fill="none" opacity="0.7" />
  <circle cx="600" cy="337.5" r="295" stroke="#E5EEEA" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Main 3D Neumorphic Raised Disc -->
  <g filter="url(#discShadow)">
    <!-- Outer Raised Rim -->
    <circle cx="600" cy="337.5" r="260" fill="url(#rimGrad)" />
    
    <!-- Outer Rim Highlight ring -->
    <circle cx="600" cy="337.5" r="259" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.9" />
    <circle cx="600" cy="337.5" r="257" stroke="rgba(210, 222, 218, 0.4)" stroke-width="1.5" fill="none" />

    <!-- Inset Bevel Ring -->
    <circle cx="600" cy="337.5" r="242" fill="#D9E4E0" />
    <circle cx="600" cy="337.5" r="240" fill="url(#faceGrad)" />
    
    <!-- Fine inner perimeter ring with subtle ticks -->
    <circle cx="600" cy="337.5" r="230" stroke="#DDE7E3" stroke-width="1.5" fill="none" />
    <circle cx="600" cy="337.5" r="228" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.8" />
  </g>

  <!-- Embedded Logo Icon (Fridge + Circuits) -->
  <image xlink:href="public/Logo_Icon.png" x="435" y="165" width="330" height="345" preserveAspectRatio="xMidYMid meet" />
</svg>